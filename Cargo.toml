[workspace]
members = [
    "engine",
    "backends/goldsrc-backend-metamod",
    "backends/goldsrc-backend-standalone",
    "hosts/goldsrc-host-wasm",
    "extensions/goldsrc-extension-reapi",
    "extensions/goldsrc-extension-metamod",
    "services/goldsrc-service-placeholders",
    "services/goldsrc-service-menu",
    "services/goldsrc-service-chat",
    "services/goldsrc-service-moderation",
    "services/goldsrc-service-watcher",
    "services/goldsrc-service-storage",
    "services/goldsrc-service-telemetry",
    "services/goldsrc-service-timer",
    "services/goldsrc-service-i18n",
    "services/goldsrc-service-reports",
]
default-members = [
    "engine",
    "backends/goldsrc-backend-metamod",
    "backends/goldsrc-backend-standalone",
    "hosts/goldsrc-host-wasm",
    "extensions/goldsrc-extension-reapi",
    "extensions/goldsrc-extension-metamod",
    "services/goldsrc-service-placeholders",
    "services/goldsrc-service-menu",
    "services/goldsrc-service-chat",
    "services/goldsrc-service-moderation",
    "services/goldsrc-service-watcher",
    "services/goldsrc-service-storage",
    "services/goldsrc-service-telemetry",
    "services/goldsrc-service-timer",
    "services/goldsrc-service-i18n",
    "services/goldsrc-service-reports",
]
resolver = "3"

[workspace.package]
version = "0.20.0"
edition = "2024"
authors = ["GoldSrc.rs Team"]
description = "High-performance modular Rust runtime and host engine for GoldSrc / Half-Life"
license = "MIT OR Apache-2.0"
repository = "https://github.com/goldsrc-rs/goldsrc-runtime"

[workspace.dependencies]
goldsrc-sys = { git = "https://github.com/goldsrc-rs/goldsrc-sdk.git", branch = "dev" }
goldsrc-api = { git = "https://github.com/goldsrc-rs/goldsrc-sdk.git", branch = "dev" }
goldsrc-spi = { git = "https://github.com/goldsrc-rs/goldsrc-sdk.git", branch = "dev" }
goldsrc-core = { path = "engine", version = "0.20.0" }
goldsrc-extension-reapi = { path = "extensions/goldsrc-extension-reapi", version = "0.20.0" }
goldsrc-extension-metamod = { path = "extensions/goldsrc-extension-metamod", version = "0.20.0" }
goldsrc-backend-metamod = { path = "backends/goldsrc-backend-metamod", version = "0.20.0" }
goldsrc-backend-standalone = { path = "backends/goldsrc-backend-standalone", version = "0.20.0" }
goldsrc-host-wasm = { path = "hosts/goldsrc-host-wasm", version = "0.20.0" }
goldsrc-service-placeholders = { path = "services/goldsrc-service-placeholders", version = "0.20.0" }
goldsrc-service-menu = { path = "services/goldsrc-service-menu", version = "0.20.0" }
goldsrc-service-chat = { path = "services/goldsrc-service-chat", version = "0.20.0" }
goldsrc-service-moderation = { path = "services/goldsrc-service-moderation", version = "0.20.0" }
goldsrc-service-watcher = { path = "services/goldsrc-service-watcher", version = "0.20.0" }
goldsrc-service-storage = { path = "services/goldsrc-service-storage", version = "0.20.0" }
goldsrc-service-telemetry = { path = "services/goldsrc-service-telemetry", version = "0.20.0" }
goldsrc-service-timer = { path = "services/goldsrc-service-timer", version = "0.20.0" }
goldsrc-service-i18n = { path = "services/goldsrc-service-i18n", version = "0.20.0" }
goldsrc-service-reports = { path = "services/goldsrc-service-reports", version = "0.20.0" }

wasmtime = { version = "50.0", default-features = false, features = [
    "cranelift",
    "pulley",
    "component-model",
    "runtime",
    "std",
] }
wit-component = "0.259.0"
wit-parser = "0.259.0"
notify = "8.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"
lexopt = "0.3"
libloading = "0.9.0"
libc = "0.2"
thiserror = "2.0"
log = "0.4.33"
rusqlite = { version = "0.41.0", features = ["bundled"] }
crossbeam-channel = "0.5"
semver = "1.0"
stitch-rs = { git = "https://github.com/ulquiorracode/stitch-rs.git", branch = "main" }
statefs-core = { git = "https://github.com/ulquiorracode/statefs-rs.git", branch = "dev" }
statefs-config = { git = "https://github.com/ulquiorracode/statefs-rs.git", branch = "dev" }
statefs-codec-toml = { git = "https://github.com/ulquiorracode/statefs-rs.git", branch = "dev" }
rustc-demangle = "0.1"

[profile.dev]
opt-level = 0
debug = 1
split-debuginfo = "unpacked"
panic = "unwind"
overflow-checks = true

# NOTE: `panic` must stay "unwind" — `catch_ffi_panic` (catch_unwind) relies on
# unwinding to stop Rust panics at the C-ABI boundary before they kill HLDS.
[profile.release]
lto = false
opt-level = "z"
strip = "debuginfo"
codegen-units = 16
panic = "unwind"
overflow-checks = true


