[package]
name = "goldsrc-backend-metamod"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Metamod backend implementation for GoldSrc.rs"

[lib]
name = "goldsrc_metamod"
crate-type = ["cdylib"]
doctest = false

[dependencies]
goldsrc-sys = { workspace = true }
goldsrc-api = { workspace = true }
goldsrc-spi = { workspace = true }
goldsrc-core = { workspace = true }
goldsrc-extension-reapi = { workspace = true, optional = true }
goldsrc-extension-metamod = { workspace = true }
stitch-rs = { workspace = true }

[features]
default = []
legacy-reapi = ["dep:goldsrc-extension-reapi"]


[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_System_Memory",
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
] }

[target.'cfg(not(windows))'.dependencies]
libc = "0.2"
