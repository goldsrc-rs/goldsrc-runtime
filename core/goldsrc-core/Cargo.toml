[package]
name = "goldsrc-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Host-side runtime orchestrator, engine bridge, configuration, storage, and hook dispatcher for GoldSrc.rs"

[dependencies]
goldsrc-sys = { workspace = true }
goldsrc-api = { workspace = true, features = ["unsafe-sys"] }
goldsrc-spi = { workspace = true }
goldsrc-service-placeholders = { workspace = true }
goldsrc-service-menu = { workspace = true }
goldsrc-service-chat = { workspace = true }
goldsrc-service-moderation = { workspace = true }
goldsrc-service-watcher = { workspace = true }
goldsrc-service-storage = { workspace = true }
goldsrc-service-telemetry = { workspace = true }
goldsrc-service-timer = { workspace = true }
goldsrc-service-i18n = { workspace = true }
goldsrc-host-wasm = { workspace = true }
lexopt = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
log = { workspace = true }
crossbeam-channel = { workspace = true }
libloading = { workspace = true }
thiserror = { workspace = true }
semver = { workspace = true }
stitch-rs = { workspace = true }
statefs-core = { workspace = true }
statefs-config = { workspace = true }
statefs-codec-toml = { workspace = true }

[features]
default = ["cli"]
cli = ["lexopt"]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_System_Memory",
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
] }
